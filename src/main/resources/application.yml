# This is required for the autoconfiguration to kick in, should be overwritten in application-secret.yml
spring:
  main:
    banner-mode: off
  mail:
    host: example.com
logging:
  level:
    root: INFO

internal:
  default-from: "SecretSanta <me@example.com>"
  default-email: me@example.com
  participant-file-location: "classpath:participants/participants.json"
  do-send: true
  use-test-email: false
  max-shuffles: 100000
  matcher-strategy: "backtracking" # Can be "backtracking" or "shuffle"
  smtp-test: false # when true, only sends one test email to default-email (no matching)
  confirm-before-send: false # when true (and do-send), shows pairs and waits for "send" on stdin
#  year: 2026      # defaults to the current year; used in email subjects
#  event-name: ""  # optional, e.g. "Dorośli" -> subject "SecretSanta 2026 - Dorośli: ..."
#  extra-details: "" # optional paragraph added to the email body, e.g. date and place of the party
